/* 便利貼容器設定 */
.sticky-note {
  position: absolute;
  width: 200px;
  min-height: 150px;
  background-color: var(--gold);
  color: #000;
  padding: 15px;
  border-radius: 4px;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
  cursor: move;
}
.note-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 12px;
  border-bottom: 1px solid rgba(0,0,0,0.1);
  padding-bottom: 5px;
}
.note-content {
  font-size: 14px;
  word-break: break-all;
}
/* 讓編輯與刪除按鈕對所有人開放顯示 */
.note-actions {
  display: flex;
  gap: 5px;
}
.btn-action {
  cursor: pointer;
  background: none;
  border: none;
  font-size: 12px;
}

<!-- 引入 Firebase SDK (請確保版本與你的其餘程式碼相容，此處為舊版相容寫法範例) -->

<script src="https://gstatic.com"></script>

<body>

<div id="bg"></div>
<div id="board" style="position: relative; width: 100%; height: 100%;"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC08he_aSCDbvC34I0Oe47ahfV7ULMwtTw",
  authDomain: "wa-alliance.firebaseapp.com",
  databaseURL: "https://wa-alliance-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wa-alliance",
  storageBucket: "wa-alliance.firebasestorage.app",
  messagingSenderId: "831519113338",
  appId: "1:831519113338:web:a15edcfc49daeef7e13bc3"
};

// 初始化 Firebase
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const database = firebase.database();

// 監聽 Firebase 資料庫，當有便利貼時渲染至畫面上
database.ref('notes').on('value', (snapshot) => {
  const board = document.getElementById('board');
  board.innerHTML = ''; // 清空畫面上舊的便利貼
  
  const notes = snapshot.val();
  if (notes) {
    Object.keys(notes).forEach((noteId) => {
      const noteData = notes[noteId];
      createNoteDOM(noteId, noteData);
    });
  }
});

// 建立便利貼 DOM 的函式
function createNoteDOM(id, data) {
  const board = document.getElementById('board');
  const note = document.createElement('div');
  note.className = 'sticky-note';
  note.style.left = data.x + 'px';
  note.style.top = data.y + 'px';
  note.dataset.id = id;

  // 這裡移除了「只有上傳者才能顯示按鈕」的判斷，現在所有人都能看到並點擊按鈕
  note.innerHTML = `
    <div class="note-header">
      <span>${data.author || '匿名'}</span>
      <div class="note-actions">
        <button class="btn-action" onclick="editNote('${id}')">✏️</button>
        <button class="btn-action" onclick="deleteNote('${id}')">❌</button>
      </div>
    </div>
    <div class="note-content" id="content-${id}">${data.content}</div>
  `;

  // 拖曳功能
  setupDrag(note, id);
  board.appendChild(note);
}

// 所有人都可以觸發的編輯功能
function editNote(id) {
  const currentContent = document.getElementById(`content-${id}`).innerText;
  const newContent = prompt("請輸入修改後的內容：", currentContent);
  
  if (newContent !== null && newContent.trim() !== "") {
    database.ref('notes/' + id).update({
      content: newContent
    }).then(() => {
      alert("修改成功！");
    }).catch((error) => {
      console.error("修改失敗：", error);
    });
  }
}

// 所有人都可以觸發的刪除功能
function deleteNote(id) {
  if (confirm("確定要刪除這張便利貼嗎？（所有人皆可刪除）")) {
    database.ref('notes/' + id).remove()
    .then(() => {
      alert("刪除成功！");
    }).catch((error) => {
      console.error("刪除失敗：", error);
    });
  }
}

// 拖曳結束後同步位置到 Firebase 
function setupDrag(element, id) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  element.onmousedown = dragMouseDown;

  function dragMouseDown(e) {
    if (e.target.closest('.note-actions')) return; // 如果點到按鈕，不觸發拖曳
    e = e || window.event;
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e = e || window.event;
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    element.style.top = (element.offsetTop - pos2) + "px";
    element.style.left = (element.offsetLeft - pos1) + "px";
  }

  function closeDragElement() {
    document.onmouseup = null;
    document.onmousemove = null;
    
    // 將新位置更新至 Firebase
    database.ref('notes/' + id).update({
      x: element.offsetLeft,
      y: element.offsetTop
    });
  }
}
</script>
